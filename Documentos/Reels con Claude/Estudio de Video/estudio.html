<title>Estudio de Video</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@400;600;800;900&family=Poppins:wght@400;600;800;900&family=Inter:wght@400;700;900&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Playfair+Display:wght@400;700;900&family=Permanent+Marker&family=Bangers&family=Oswald:wght@400;600;700&family=Yellowtail&family=Kaushan+Script&family=Pacifico&family=Dancing+Script:wght@700&display=swap">
<style>
/* Layout: a dark editing bay, always dark. Desktop: library | monitor | inspector over the timeline.
   Phone: monitor, centered-playhead timeline and a tool bar; panels slide up as sheets. */
:root{
  --bg:#0F1014; --panel:#17181E; --panel2:#1F2129; --panel3:#272A34; --line:#2D303B;
  --fg:#ECEDF2; --mut:#9598A8; --dim:#6B6E7E;
  --acc:#F5A524; --acc-ink:#1B1304; --sel:#6E9BFF; --danger:#F0616D; --ok:#43CF90;
  --t-video:#33405E; --t-sub:#5B44A0; --t-txt:#24706B; --t-sfx:#8A5226; --t-mus:#74365C; --blk-ink:#F3F3F7;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}

/* header */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:15px}
.rec{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.ptitle{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
#selVersion{max-width:46%}
#inTitulo{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:700;font-size:15px}
#inTitulo:hover{border-color:var(--line)} #inTitulo:focus{border-color:var(--sel);background:var(--panel)}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0}
textarea{resize:vertical;width:100%}
.estado{color:var(--mut);font-size:12px;white-space:nowrap}
.estado.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.estado.warn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:1px solid transparent;background:transparent;border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;color:var(--fg)}
.icon:hover{background:var(--panel3)}
.icon.sm{width:26px;height:26px}
.icon svg{width:16px;height:16px}
.only-narrow{display:none}

/* work area */
.work{display:grid;grid-template-columns:268px minmax(0,1fr) 340px;gap:8px;min-height:0}
#biblio,#insp{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:7px;color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
.tabs button.on{background:var(--panel3);color:var(--fg)}
#inspTabs{display:grid;grid-template-columns:repeat(3,1fr)}
.pbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
.hint{color:var(--mut);font-size:12px;margin:0}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.f{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:8px}
.f > label{color:var(--mut);font-size:12px}
.f output{font-family:var(--f-mono);font-size:11px;color:var(--mut);min-width:38px;text-align:right}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.chip.on{border-color:var(--acc);color:var(--acc)}
.tline{font-family:var(--f-mono);font-size:11px;width:84px}

/* stage */
.stage{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cwrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:10px;
  background:repeating-conic-gradient(var(--panel) 0 25%,var(--panel2) 0 50%) 0 0/18px 18px}
#cv{display:block;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.35);touch-action:none;background:#000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.empty-stage{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--panel)}
.empty-stage div{max-width:360px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-stage h2{margin:0;font-size:18px;text-wrap:balance}
.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.tp-mid{display:flex;align-items:center;gap:6px}
.tp-right{display:flex;justify-self:end;gap:2px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.play svg{width:16px;height:16px}
.tc{white-space:nowrap;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--mut)}
.tc b{color:var(--fg);font-weight:600}
.spacer{flex:1}

/* library */
.pcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.pcard:hover{background:var(--panel2)}
.pcard.on{background:var(--panel2);border-color:var(--line)}
.pcard .th{width:44px;height:64px;border-radius:5px;background:#000;object-fit:cover;display:block}
.pcard b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--mut);font-size:11px}
.badge{display:inline-block;background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px;margin-left:6px;vertical-align:1px}
.pmenu{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px}
.snd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 4px;border-radius:8px}
.snd:hover{background:var(--panel2)}
.snd b{font-size:12.5px;display:block}
.snd small{color:var(--mut);font-size:11px;white-space:nowrap}
.snd .icon{background:var(--panel3)}
.snd .icon.playing{background:var(--acc);color:var(--acc-ink)}
.search{width:100%}
.doc{font-size:12.5px;line-height:1.55;color:var(--fg)}
.doc p{margin:0 0 8px}
.doc code,.doc pre{font-family:var(--f-mono);font-size:11px;background:var(--panel2);border-radius:6px}
.doc code{padding:1px 4px}
.doc pre{padding:8px;overflow-x:auto;white-space:pre;border:1px solid var(--line)}
.doc details{border:1px solid var(--line);border-radius:8px;padding:8px}
.doc summary{cursor:pointer;font-weight:700}
.doc ol{padding-left:18px;margin:6px 0}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;font-family:var(--f-mono);font-size:11px}

/* lists in inspector */
.item{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.item.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.item .top{display:flex;gap:6px;align-items:center}
.item .top .spacer{flex:1}
.item textarea{min-height:38px;background:var(--panel)}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.fx{border:2px solid transparent;background:transparent;padding:0;border-radius:8px;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11px;font-weight:600;color:var(--mut)}
.fx canvas{width:100%;aspect-ratio:9/14;border-radius:6px;background:#000;display:block}
.fx.on{border-color:var(--acc);color:var(--fg)}
.cut{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--panel2)}
.cut.sel{border-color:var(--sel)}

/* timeline */
.timeline{display:flex;flex-direction:column;height:262px;overflow:hidden}
.tl-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-bar label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.tl-bar input[type=range]{width:120px}
.zoomctl{display:flex;align-items:center;gap:4px}
.zoomctl .icon{font-size:17px;font-weight:700}
.tl-wrap{position:relative;flex:1;min-height:0;display:flex}
.tl-scroll{flex:1;overflow:auto;position:relative;min-height:0;scrollbar-width:thin;overscroll-behavior-x:contain}
.tl-inner{position:relative;min-height:100%}
.trow{position:relative;height:33px}
.trow.ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--panel)}
.trow.video{height:58px}
.tlab{position:absolute;top:50%;transform:translate(-100%,-50%);display:flex;align-items:center;gap:6px;padding-right:12px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;pointer-events:none}
.tlab svg{width:15px;height:15px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-family:var(--f-mono);font-size:10px;color:var(--dim);padding:3px 0 0 4px;white-space:nowrap}
.tick.mn{top:16px}
.blk{position:absolute;top:4px;bottom:4px;border-radius:6px;color:var(--blk-ink);font-size:11px;font-weight:600;overflow:hidden;display:flex;align-items:center;padding:0 8px;white-space:nowrap;cursor:grab;touch-action:pan-x pan-y;border:1px solid rgba(255,255,255,.08);user-select:none;-webkit-user-select:none}
.blk span{overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.blk.sel{outline:2px solid #FFFFFF;outline-offset:-1px;z-index:2;touch-action:none}
.blk.k-clip.sel{touch-action:pan-x pan-y}
.blk .h{position:absolute;top:0;bottom:0;width:9px;z-index:2;cursor:ew-resize;touch-action:none}
.blk .h.l{left:0} .blk .h.r{right:0}
.blk:hover .h{background:rgba(255,255,255,.18)}
.blk.sel .h{background:#FFFFFF;width:12px}
.blk.sel .h::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:12px;margin:-6px 0 0 -1px;background:#1B1C22;border-radius:1px}
.k-clip{background:var(--t-video);padding:0}
.k-clip .film{position:absolute;inset:0;overflow:hidden;opacity:.95;background:#000}
.k-clip .film img{position:absolute;top:0;height:100%;object-fit:cover}
.k-clip span{background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 5px;margin:0 14px;font-family:var(--f-mono);font-size:10px;text-shadow:none}
.k-sub{background:var(--t-sub)} .k-elem{background:var(--t-txt)} .k-sfx{background:var(--t-sfx)} .k-mus{background:var(--t-mus)}
.tr-dot{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;transform:rotate(45deg);border-radius:4px;border:2px solid var(--panel);background:#FFFFFF;z-index:4;padding:0}
.tr-dot.on{background:var(--acc)}
.tr-dot.sel{box-shadow:0 0 0 2px var(--sel)}
.lane-add{position:absolute;top:4px;bottom:4px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:6px;border:1px dashed var(--line);background:var(--panel2);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap;z-index:1}
.lane-add:hover{color:var(--fg);border-color:var(--mut)}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#FFFFFF;z-index:6;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:9px;background:#FFFFFF;border-radius:2px 2px 7px 7px}
.tl-empty{padding:24px;color:var(--mut)}

/* barra de herramientas y paneles deslizables (celular) */
.toolbar{display:none}
.sheet-head{display:none}
.tool{flex:0 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:0;color:var(--fg);font-size:11.5px;font-weight:600;padding:7px 4px;border-radius:10px}
.tool svg{width:24px;height:24px}
.tool:active,.tool:hover{background:var(--panel2)}
.tool.danger{color:var(--danger)}
.tool.back{min-width:46px;color:var(--mut)}
.tool.back span{display:none}
.ctxbar{position:absolute;z-index:3;display:flex;gap:2px;background:var(--panel3);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;left:0;top:0}
.ctxbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--fg);font-size:10.5px;font-weight:700;padding:6px 7px;border-radius:8px;min-width:50px}
.ctxbar button:hover,.ctxbar button:active{background:var(--panel2)}
.ctxbar button svg{width:19px;height:19px}
.ctxbar .danger{color:var(--danger)}
.fmt{display:flex;gap:4px}
.fmt button{width:38px;height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;font-size:15px;font-family:Georgia,serif}
.fmt button.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.efxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.efx{border:2px solid var(--line);background:#101116;border-radius:9px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.efx span{font-family:'Yellowtail',cursive;font-size:24px;line-height:1.1}
.efx small{font-size:10px;color:var(--mut);font-weight:600}
.efx.on{border-color:var(--acc)}
.chip-q{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.chip-q:hover{background:var(--panel3)}

/* toasts & modal */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px}
.toast .row-btns{justify-content:flex-end}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.6);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.mbox h3{margin:0;font-size:16px}
.mbox canvas{max-width:100%;max-height:42vh;border-radius:6px;align-self:center;background:#000}
.prog{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}

@media (max-width:1100px){ .work{grid-template-columns:230px minmax(0,1fr) 300px} }
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  #app{height:100%;height:100dvh;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;padding-block:6px 0}
  .only-narrow{display:inline-flex}
  .brand-t,#inTitulo,.estado,#tlSplit,#tlDel,#zoom{display:none}
  .bar{gap:8px;flex-wrap:nowrap}
  .ptitle{min-width:0;flex:1}
  #selVersion{max-width:100%;font-size:12px}
  .work{display:contents}
  .stage{border:0;background:transparent}
  .cwrap{background:var(--bg);padding:2px}
  .transport{border-top:0;padding:2px 4px}
  #biblio,#insp{position:fixed;left:0;right:0;bottom:0;z-index:40;height:56dvh;border-radius:16px 16px 0 0;border-bottom:0;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -14px 40px rgba(0,0,0,.55);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
  #biblio{height:80dvh}
  #biblio.open,#insp.open{transform:none;visibility:visible}
  #inspTabs{display:none}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 6px;position:relative}
  .sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
  .sheet-head b{flex:1;font-size:16px}
  .timeline{height:clamp(220px,32dvh,300px)}
  .tl-bar{padding:2px 6px;border-bottom:0}
  .trow{height:30px}
  .trow.video{height:52px}
  .tc{font-size:12px}
  .toolbar{display:flex;gap:2px;overflow-x:auto;padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px));scrollbar-width:none;margin-inline:-6px}
  .toolbar::-webkit-scrollbar{display:none}
  .toasts{bottom:calc(86px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:none}
}
@media (prefers-reduced-motion: reduce){ .prog i,#biblio,#insp{transition:none} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><span class="rec" aria-hidden="true"></span><span class="brand-t">Estudio</span></div>
    <button class="icon only-narrow" id="btnBiblio" title="Biblioteca" aria-label="Biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <div class="ptitle">
      <input id="inTitulo" type="text" aria-label="Nombre del video" placeholder="Sin video abierto" disabled>
      <select id="selVersion" aria-label="Versión del video" disabled></select>
      <span class="estado" id="estado"></span>
    </div>
    <div class="acts">
      <button class="chip-q" id="btnCalidad" title="Calidad de exportación">1080p ▾</button>
      <button class="btn primary" id="btnExport" disabled>Exportar</button>
    </div>
  </header>

  <div class="work">
    <aside class="panel" id="biblio">
      <div class="sheet-head"><b>Biblioteca</b><button class="btn sm primary" data-act="cerrarHoja">Listo</button></div>
      <nav class="tabs" id="libTabs">
        <button data-lt="videos" class="on">Videos</button>
        <button data-lt="sonidos">Sonidos</button>
        <button data-lt="claude">Cómo llegan</button>
      </nav>
      <div class="pbody" id="libBody"></div>
    </aside>

    <section class="panel stage">
      <div class="cwrap" id="cwrap">
        <canvas id="cv" width="540" height="960"></canvas>

function nivelar(buf,obj){let pk=0;for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>pk)pk=a}}if(pk>0){const g=obj/pk;for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=g}}return buf}
const bufCache=new Map();
function getBuffer(ref){
  const key=ref.lib?'lib:'+ref.lib:'url:'+(ref.assetId||ref.url);
  if(bufCache.has(key))return bufCache.get(key);
  const p=(async()=>{
    if(ref.lib){const d=sonido(ref.lib);if(!d)throw new Error('sin sonido');const sr=44100;const oc=new OfflineAudioContext(2,Math.ceil(d.dur*sr),sr);d.fn(oc,oc.destination);return nivelar(await oc.startRendering(),d.cat==='Música'?0.79:0.89)}
    const r=await fetch(ref.assetId?'/_blob/'+ref.assetId:ref.url);const ab=await r.arrayBuffer();const oc=new OfflineAudioContext(2,44100,44100);return await oc.decodeAudioData(ab)})();
  bufCache.set(key,p);p.catch(()=>bufCache.delete(key));return p;
}

function pushHist(force){const now=Date.now();if(!force&&now-S.lastHist<800)return;const snap=JSON.stringify(S.E);if(S.hist[S.hist.length-1]===snap)return;S.hist.push(snap);if(S.hist.length>80)S.hist.shift();S.fut=[];S.lastHist=now}
function commit(fn,{hist=true,coalesce=false,insp=true}={}){if(!S.E)return;if(hist)pushHist(!coalesce);fn();afterChange(insp)}
function afterChange(insp=true){precargarAudio();renderTimeline();if(insp)renderInspector();renderToolbar();S.needDraw=true;syncVideo(S.T);scheduleSave();updateTransport();ensureFonts()}
function sinCambios(){if(S.hist.length&&S.hist[S.hist.length-1]===JSON.stringify(S.E))S.hist.pop()}
function undo(){const cur=JSON.stringify(S.E);while(S.hist.length&&S.hist[S.hist.length-1]===cur)S.hist.pop();if(!S.hist.length){updateTransport();return}S.fut.push(cur);S.E=JSON.parse(S.hist.pop());S.lastHist=0;afterChange()}
function redo(){if(!S.fut.length)return;S.hist.push(JSON.stringify(S.E));S.E=JSON.parse(S.fut.pop());S.lastHist=0;afterChange()}

  S.db=db;S.assets=assets;S.downloads=downloads;S.user=user;
  if(!db){sinBase('Iniciá sesión en claude.ai para ver y editar tus videos.');return}
  const timer=setTimeout(()=>{if(S.firstProj)$('#emptyText').textContent='La biblioteca todavía no responde. Revisá tu conexión; se carga sola cuando vuelva.'},10000);
  db.collection('proyectos').orderBy('actualizado','desc').onSnapshot(snap=>{
    clearTimeout(timer);
    const prevIds=new Set(S.proyectos.map(p=>p.id));const wasFirst=S.firstProj;
    S.proyectos=snap.docs.map(d=>({id:d.id,...d.data()}));

  },err=>{clearTimeout(timer);sinBase(err?.code==='revoked'?'Ya no tenés acceso a esta biblioteca.':'No se pudo abrir la biblioteca. Volvé a cargar la página más tarde.')});

function cerrarProyecto(){if(S.unsubV)S.unsubV();S.unsubV=null;pause();S.pid=null;S.vn=null;S.E=null;S.versiones=[];vid.removeAttribute('src');vPrev.removeAttribute('src')}
function abrirProyecto(pid,vn){
  if(S.unsubV)S.unsubV();pause();S.pid=pid;S.versiones=[];S.vn=null;S.E=null;S.sel=null;lsSet('ultimo',pid);renderAll();

    if(S.pid!==pid)return;
    const prevMax=S.versiones.length?Math.max(...S.versiones.map(v=>v.n)):0;
    S.versiones=snap.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.video);

      if(S.vn===prevMax){const old=S.vn;abrirVersion(max).then(()=>toast(`Llegó la <b>versión ${max}</b> y ya la tenés abierta. Tus cambios de la v${old} quedan guardados en esa versión.`,[{t:`Traer mis ajustes de la v${old}`,fn:()=>traerAjustes(old)}]))}

async function abrirVersion(n){
  const v=S.versiones.find(x=>x.n===n);if(!v)return;pause();S.vn=n;S.version=v;S.E=null;S.sel=null;S.hist=[];S.fut=[];S.T=0;setEstado('Cargando…');

  if(v.video.ancho&&v.video.alto){const vw=v.video.ancho,vh=v.video.alto;if(vh>=vw){cv.height=960;cv.width=Math.round(960*vw/vh/2)*2}else{cv.width=960;cv.height=Math.round(960*vh/vw/2)*2}fitCanvas()}

function traerAjustes(desde){
  (async()=>{let E=null;try{const d=await S.db.doc(`proyectos/${S.pid}/ediciones/v${desde}`).get();if(d.exists)E=d.data().estado}catch{}
    if(!E){toast(`La v${desde} no tenía ajustes guardados.`);return}
    commit(()=>{S.E.filtro={...E.filtro};S.E.audio=JSON.parse(JSON.stringify(E.audio));S.E.calidad={...E.calidad};S.E.intro={...E.intro};S.E.outro={...E.outro};
      const est=E.subs?.[0]?.est;if(est)S.E.subs.forEach(s=>{s.est={...est};s.x=E.subs[0].x;s.y=E.subs[0].y;s.rot=E.subs[0].rot||0})});
    toast(`Listo: filtros, audio, calidad y estilo de subtítulos copiados de la v${desde}.`)})();

async function genThumbs(url){
  const tok=++S.thumbTok;S.thumbs=[];const v=prepVideo(document.createElement('video'));v.muted=true;v.preload='auto';v.src=url;await once(v,'loadedmetadata',8000);if(v.readyState<2){v.play().then(()=>v.pause()).catch(()=>{});await once(v,'loadeddata',8000)}
  if(tok!==S.thumbTok||!v.videoWidth){v.remove();return}const d=v.duration||0;const step=Math.max(0.5,d/48);S.thumbStep=step;const th=46,tw=Math.round(th*v.videoWidth/v.videoHeight);
  const cc=document.createElement('canvas');cc.width=tw*2;cc.height=th*2;const cx=cc.getContext('2d');
  for(let t=0;t<d;t+=step){if(tok!==S.thumbTok){v.remove();return}v.currentTime=Math.min(t+0.05,Math.max(0,d-0.05));await once(v,'seeked',3000);cx.drawImage(v,0,0,cc.width,cc.height);S.thumbs.push({t,url:cc.toDataURL('image/jpeg',0.6)});if(S.thumbs.length%8===0)renderTimeline()}
  S.thumbW=tw;renderTimeline();v.removeAttribute('src');v.load();v.remove();
}

/* ============ subir archivos ============ */
function videoMeta(file){return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.muted=true;const u=URL.createObjectURL(file);v.onloadedmetadata=()=>{r({w:v.videoWidth,h:v.videoHeight,d:v.duration});URL.revokeObjectURL(u)};v.onerror=()=>{r(null);URL.revokeObjectURL(u)};v.src=u})}
async function subirVideo(file,pid){
  if(!S.assets||!S.db){toast('Para subir videos necesitás permiso de edición en esta página.');return}
  if(file.size>20*1024*1024){toast('Ese archivo pesa más de 20 MB. Comprimilo o pedile a Claude que lo suba desde el chat.');return}
  const meta=await videoMeta(file);if(!meta){toast('No pude leer ese video. Probá con un MP4.');return}
  toast('Subiendo el video…');
  try{const up=await S.assets.upload(file,{type:file.type||'video/mp4'});const now=new Date().toISOString();
    const ver={creada:now,nota:'Subido desde el editor',origen:'Editor',video:{assetId:up.id,ancho:meta.w,alto:meta.h,duracion:meta.d},subtitulos:[],textos:[]};
    if(pid){const p=S.proyectos.find(x=>x.id===pid);const n=(p?.ultimaVersion||0)+1;await S.db.doc(`proyectos/${pid}/versiones/v${n}`).set({n,...ver});await S.db.doc(`proyectos/${pid}`).update({ultimaVersion:n,ultimoVideo:up.id,actualizado:now});toast(`Versión ${n} agregada.`)}
    else{const id=slug(file.name.replace(/\.[^.]+$/,''))+'-'+uid().slice(0,4);await S.db.doc(`proyectos/${id}/versiones/v1`).set({n:1,...ver});await S.db.doc(`proyectos/${id}`).set({titulo:file.name.replace(/\.[^.]+$/,''),creado:now,actualizado:now,ultimaVersion:1,ultimoVideo:up.id});abrirProyecto(id)}
  }catch(e){toast(e?.code==='quota_exceeded'?'Se llenó el espacio de archivos de esta página.':'No se pudo subir: '+esc(e?.message||'error'))}
}

function selItem(){if(!S.sel||!S.E)return null;const {k,id}=S.sel;if(k==='sub')return S.E.subs.find(x=>x.id===id);if(k==='elem')return S.E.elems.find(x=>x.id===id);if(k==='clip')return S.E.clips.find(x=>x.id===id);if(k==='sfx')return S.E.audio.sfx.find(x=>x.id===id);return null}

function splitAt(T){const L=locate(T);if(!L)return;if(L.lt<0.1||L.o.len-L.lt<0.1){toast('Mové el cursor dentro de un clip para dividirlo.');return}
  commit(()=>{const c=L.o.c,nc={id:uid(),ini:L.s,fin:c.fin};c.fin=L.s;S.E.clips.splice(L.i+1,0,nc);S.sel={k:'clip',id:nc.id}})}

  if(s.k==='clip'&&S.E.clips.length<2){toast('No podés borrar el único clip.');return}
  commit(()=>{if(s.k==='sub')S.E.subs=S.E.subs.filter(x=>x.id!==s.id);else if(s.k==='elem')S.E.elems=S.E.elems.filter(x=>x.id!==s.id);else if(s.k==='sfx')S.E.audio.sfx=S.E.audio.sfx.filter(x=>x.id!==s.id);
    else if(s.k==='clip'){S.E.clips=S.E.clips.filter(x=>x.id!==s.id);delete S.E.trans[s.id]}else if(s.k==='mus')S.E.audio.musica=null;S.sel=null});
  if(S.T>dur())setT(dur())}

  commit(()=>{const it={id:uid(),kind:'sub',t:'Nuevo subtítulo',a:T,b:Math.min(tot,T+2),x:prev?.x??0.5,y:prev?.y??0.74,est:{...(prev?.est||EST_SUB)}};S.E.subs.push(it);S.sel={k:'sub',id:it.id}})}
function addTexto(){commit(()=>{const it={id:uid(),kind:'elem',tipo:'texto',t:'Tu título',a:S.T,b:Math.min(dur(),S.T+3),x:0.5,y:0.3,est:{...EST_TXT}};S.E.elems.push(it);S.sel={k:'elem',id:it.id}})}
function addSfx(id,ref){const d=ref?null:sonido(id);commit(()=>{const it={id:uid(),ref:ref||{lib:id},nombre:d?d.nombre:(S.misAudios.find(a=>'url:'+a.key===id)?.nombre||'Audio'),dur:d?d.dur:2,a:S.T,vol:1};S.E.audio.sfx.push(it);S.sel={k:'sfx',id:it.id}});
  if(ref)getBuffer(ref).then(b=>{const it=S.E?.audio.sfx.find(x=>x.ref===ref);if(it){it.dur=b.duration;renderTimeline()}}).catch(()=>{});toast('Efecto agregado en el cursor.')}
function usarMusica(id,ref,nombre){const d=ref?null:sonido(id);commit(()=>{S.E.audio.musica={ref:ref||{lib:id},nombre:d?d.nombre:nombre,vol:0.6,ini:0,fade:true};S.sel={k:'mus',id:'mus'}});toast(`Música: <b>${esc(d?d.nombre:nombre)}</b>. Ajustá el volumen en Audio.`)}
function parseSRT(txt){const out=[];txt.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{const ls=b.trim().split('\n');const i=ls.findIndex(l=>l.includes('-->'));if(i<0)return;const [a,z]=ls[i].split('-->').map(s=>{const m=s.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);return m?(+m[1])*3600+(+m[2])*60+(+m[3])+(+m[4])/1000:null});if(a==null||z==null)return;out.push({a,b:z,t:ls.slice(i+1).join('\n')})});return out}
function toSRT(){const p=t=>{const h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=Math.floor(t)%60,ms=Math.round((t%1)*1000);return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`};return[...S.E.subs].sort((a,b)=>a.a-b.a).map((s,i)=>`${i+1}\n${p(s.a)} --> ${p(s.b)}\n${s.t}\n`).join('\n')}

2. Subí el MP4: Artifact action "publish" con url, file_path y asset: true.
   Guardá el "id" del resultado (assetId). Límite 15 MB: si pesa más,
   recomprimí con ffmpeg -c:v libx264 -crf 26 -c:a aac -movflags +faststart.
3. Elegí el proyecto: ArtifactData action "list", collection "proyectos".
   - Versión nueva de un video que ya está: usá ese mismo id de proyecto.
   - Video nuevo: id = slug corto y estable, p. ej. "ubicacion-arcoiris-juncal".
4. Escribí la versión (n = ultimaVersion + 1, o 1 si es nuevo):
   ArtifactData "set" en proyectos/<id>/versiones/v<n>
   {
     "n": <n>, "creada": "<ISO>", "nota": "qué cambió",
     "origen": "chat donde se hizo",
     "video": {"assetId": "<id>", "ancho": 1080, "alto": 1920, "duracion": 12.4},
     "subtitulos": [{"texto": "Hola", "inicio": 0.0, "fin": 1.8,
                     "x": 0.5, "y": 0.74, "estilo": {"color": "#FFFFFF"}}],
     "textos": [{"texto": "Título", "inicio": 0, "fin": 3, "x": 0.5, "y": 0.3}]
   }
   OBLIGATORIO: subí el MP4 SIN subtítulos quemados (renderizá una versión
   limpia) y mandá TODOS los subtítulos en "subtitulos", con sus tiempos.
   Así aparecen en la línea de tiempo y se pueden editar y mover.
   x/y van de 0 a 1 (centro del texto). "estilo" acepta: fuente, peso,
   tam (px sobre 1080 de ancho), color, mayus, contorno, grosor, sombra,
   fondo ("ninguno"|"caja"), colorFondo, opFondo, anim ("pop"|"fundido"|
   "subir"|"escribir"|"karaoke"), resaltado, efecto ("neon-dorado"|
   "neon-rosa"|"neon-rojo"|"neon-celeste"|"neon-verde"|"fuego"|"oro"|"plata"|
   "arcoiris"|"personal"), colorEfecto (hex, con "personal"), tornasol
   (0-100, reflejo tornasolado con "personal"), brillo (0-100), cursiva,
   subrayado, ancho, alin.
   Los textos fijos (títulos, etiquetas) van en "textos" con el mismo formato.
5. Actualizá el proyecto: ArtifactData "set" (nuevo) o "update" (existente)
   en proyectos/<id>
   {"titulo": "...", "ultimaVersion": <n>, "ultimoVideo": "<assetId>",
    "actualizado": "<ISO>", "creado": "<ISO, solo si es nuevo>"}
   Escribí primero la versión y después el proyecto. La página se actualiza sola.
6. Ediciones del usuario: proyectos/<id>/ediciones/v<n> (solo lectura para Claude).`;

    <div class="sec"><h4>Música</h4>${m?`<div class="item ${S.sel?.k==='mus'?'sel':''}"><div class="top"><b>${esc(m.nombre)}</b><span class="spacer"></span><button class="icon sm" data-act="quitarMusica" aria-label="Quitar música">${ICON.trash}</button></div>${rng_('Volumen','mus|vol',m.vol,0,1.5,0.05)}<div class="f"><label>Empieza en</label>${tin('mus|ini',m.ini||0,'Inicio de la música')}<span></span></div><div class="f"><label>Fundido final</label><input type="checkbox" data-bind="mus|fade" data-type="bool" ${m.fade!==false?'checked':''}><span></span></div></div>`:'<p class="hint">Sin música. Elegí una canción en la biblioteca.</p>'}<div class="row-btns"><button class="btn sm" data-act="abrirSonidos">Abrir biblioteca de sonidos</button></div></div>

function drawPresetThumbs(){$$('canvas[data-prev]').forEach(c=>{const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);if(vid.readyState<2)return;const f={...FILTRO0,...PRESETS[c.dataset.prev][1]};x.filter=filtroCSS(f,0);const s=Math.max(c.width/vid.videoWidth,c.height/vid.videoHeight);const w=vid.videoWidth*s,h=vid.videoHeight*s;x.drawImage(vid,(c.width-w)/2,(c.height-h)/2,w,h);x.filter='none';if(f.calidez){x.globalCompositeOperation='soft-light';x.fillStyle=f.calidez>0?`rgba(255,138,36,${Math.abs(f.calidez)/100*0.65})`:`rgba(40,118,255,${Math.abs(f.calidez)/100*0.65})`;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='source-over'}})}

/* binding */
function target(key){const E=S.E;if(!E)return null;const [k,id]=key.split(':');
  switch(k){case'sub':return S.sel?.k==='sub'?E.subs.find(x=>x.id===S.sel.id):null;case'subid':return E.subs.find(x=>x.id===id);case'elem':return S.sel?.k==='elem'?E.elems.find(x=>x.id===S.sel.id):null;
    case'clip':return S.sel?.k==='clip'?E.clips.find(x=>x.id===S.sel.id):null;case'filtro':return E.filtro;case'audio':return E.audio;case'calidad':return E.calidad;case'intro':return E.intro;case'outro':return E.outro;
    case'edicion':return E;case'mus':return E.audio.musica;case'sfx':return E.audio.sfx.find(x=>x.id===id);case'trans':if(!E.trans[id])E.trans[id]={tipo:'corte',dur:0.6};return E.trans[id]}return null}
function setPath(o,p,v){const ks=p.split('.');let x=o;for(let i=0;i<ks.length-1;i++){x[ks[i]]=x[ks[i]]||{};x=x[ks[i]]}x[ks[ks.length-1]]=v}
function onBind(el,final){const [key,path]=el.dataset.bind.split('|');const t=target(key);if(!t)return;const ty=el.dataset.type;let v;
  if(ty==='bool')v=el.checked;else if(ty==='num')v=+el.value;else if(ty==='pct')v=+el.value/100;else if(ty==='time'){if(!final)return;v=parseT(el.value);if(v==null){el.value=fmt(path.split('.').reduce((a,k)=>a?.[k],t));return}}else v=el.value;
  const out=el.nextElementSibling;if(out&&out.tagName==='OUTPUT')out.textContent=ty==='pct'?Math.round(v*100)+'%':(+v).toFixed(el.step&&+el.step<1?2:0)+(out.textContent.match(/[^\d.\-]+$/)?.[0]||'');
  commit(()=>{
    if(ty==='time'){const tot=dur();if(key==='clip'){v=path==='ini'?clamp(v,0,t.fin-0.1):clamp(v,t.ini+0.1,S.srcDur||v)}else if(path==='a')v=clamp(v,0,(t.b??tot)-0.05);else if(path==='b')v=clamp(v,t.a+0.05,tot);else v=Math.max(0,v);el.value=fmt(v)}
    setPath(t,path,v);
    if(key==='sub'&&S.E.subsJuntos===true&&['x','y'].includes(path))S.E.subs.forEach(o=>{if(o!==t)setPath(o,path,v)});
    if(key==='filtro'&&path!=='preset')t.preset='';
  },{coalesce:!final,insp:!!el.dataset.rerender});
  if(key==='mus'||key.startsWith('sfx')||key==='audio'){if(S.playing){pause();play()}}
}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset?.bind&&el.type!=='checkbox'&&el.tagName!=='SELECT')onBind(el,false)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset?.bind)onBind(el,true);else if(el.dataset?.file)onFile(el)});
async function onFile(el){const f=el.files?.[0];el.value='';if(!f)return;const k=el.dataset.file;
  if(k==='video')subirVideo(f);else if(k==='version')subirVideo(f,el.dataset.v);else if(k==='imagen')subirImagen(f);else if(k==='audio')subirAudio(f);
  else if(k==='srt'){const subs=parseSRT(await f.text());if(!subs.length){toast('No encontré subtítulos en ese archivo.');return}const base=S.E.subs[0];commit(()=>{S.E.subs=subs.map(s=>({id:uid(),kind:'sub',t:s.t,a:s.a,b:s.b,x:base?.x??0.5,y:base?.y??0.74,est:{...(base?.est||EST_SUB)}}))});toast(`${subs.length} subtítulos importados.`)}}

  delSfx:el=>commit(()=>{S.E.audio.sfx=S.E.audio.sfx.filter(x=>x.id!==el.dataset.v);if(S.sel?.id===el.dataset.v)S.sel=null}),

  tamTodos:()=>{const it=selItem();if(!it||S.sel.k!=='sub')return;commit(()=>S.E.subs.forEach(s=>{s.est.tam=it.est.tam;s.rot=it.rot||0}));toast('Tamaño y giro copiados a todos los subtítulos.')},

  efecto:el=>{const t=target(el.dataset.k);if(t)commit(()=>{t.est.efecto=el.dataset.v;if(t.est.brillo==null)t.est.brillo=70;if(el.dataset.v==='personal'){if(!t.est.colorEfecto)t.est.colorEfecto='#FF4FD8';if(t.est.tornasol==null)t.est.tornasol=60}})},
  colorEfecto:el=>{const t=target(el.dataset.k);if(t)commit(()=>{t.est.colorEfecto=el.dataset.v;t.est.efecto='personal'})},
  pos:el=>{const t=target(el.dataset.k);if(t)commit(()=>(el.dataset.k==='sub'?grupo(t):[t]).forEach(o=>{o.y=+el.dataset.v;o.x=0.5}))},
  estiloTodos:()=>{const it=selItem();if(!it)return;commit(()=>S.E.subs.forEach(s=>{s.est={...it.est};s.x=it.x;s.y=it.y;s.rot=it.rot||0}));toast('Estilo aplicado a todos los subtítulos.')},
  preset:el=>{const k=el.dataset.v;commit(()=>{S.E.filtro={...FILTRO0,...PRESETS[k][1],preset:k}})},
  split:()=>splitAt(S.T),borrarSel:()=>borrarSel(),
  clipMov:el=>{const it=selItem();const i=S.E.clips.indexOf(it),j=i+(+el.dataset.v);if(j<0||j>=S.E.clips.length)return;commit(()=>{const a=S.E.clips;[a[i],a[j]]=[a[j],a[i]]})},
  transTodos:()=>{const L=layout();if(L.length<2)return;const f=transDe(L[1].c.id);commit(()=>L.slice(1).forEach(o=>S.E.trans[o.c.id]={...f}))},
  quitarMusica:()=>commit(()=>{S.E.audio.musica=null}),
  abrirSonidos:()=>{setLib('sonidos');$('#biblio').classList.add('open')},

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.dataset.act==='abrir'&&e.target.closest('[data-act="menu"],.pmenu'))return;e.stopPropagation();f(el,e)});
function copiar(txt,sel){navigator.clipboard?.writeText(txt).then(()=>toast('Copiado.'),()=>{if(sel){if(sel.select)sel.select();else{const r=document.createRange();r.selectNodeContents(sel);getSelection().removeAllRanges();getSelection().addRange(r)}}toast('Seleccioné el texto: copialo con Ctrl+C.')})}

/* ---------- timeline (cursor fijo al centro) ---------- */
const tlInner=$('#tlInner'),tlScroll=$('#tlScroll');
const TLI={video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
  subs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M13 15h4M7 11h10"/></svg>',
  elems:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>',
  sfx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>',
  mus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'};
function renderTimeline(){
  if(!S.E){tlInner.style.width='';tlInner.innerHTML='<div class="tl-empty">La línea de tiempo aparece cuando abrís un video.</div>';return}
  const E=S.E,z=S.zoom,tot=dur(),L=layout(),pad=S.pad=Math.max(40,Math.round(tlScroll.clientWidth/2));
  tlInner.style.width=(pad*2+tot*z)+'px';const X=t=>pad+t*z;
  const blk=(kind,id,a,len,label,extra='',edges=true)=>`<div class="blk k-${kind} ${S.sel?.id===id?'sel':''}" data-kind="${kind}" data-id="${id}" style="left:${X(a)}px;width:${Math.max(8,len*z)}px">${extra}${edges?'<i class="h l" data-edge="l"></i>':''}<span>${esc(label)}</span>${edges?'<i class="h r" data-edge="r"></i>':''}</div>`;
  const steps=[0.25,0.5,1,2,5,10,15,30,60];const step=steps.find(s=>s*z>=64)||60;let ticks='';for(let t=0;t<=tot+1e-6;t+=step){ticks+=`<div class="tick" style="left:${X(t)}px">${t<60?t.toFixed(step<1?2:0)+'s':fmt(t).slice(0,5)}</div>`;if(step*z>=120&&t+step/2<=tot)ticks+=`<div class="tick mn" style="left:${X(t+step/2)}px"></div>`}
  const film=o=>{if(!S.thumbs.length)return'';const tw=Math.max(S.thumbW||26,(S.thumbStep||1)*z);let h='<div class="film">',last=-1e9;for(const th of S.thumbs){if(th.t<o.c.ini-0.01||th.t>=o.c.fin)continue;const x=(th.t-o.c.ini)*z;if(x-last<tw-0.5)continue;last=x;h+=`<img src="${th.url}" style="left:${x}px;width:${Math.ceil(tw)+1}px" alt="">`}return h+'</div>'};
  const row=(cls,lab,inner)=>`<div class="trow ${cls}" data-lane="${cls}">${lab?`<div class="tlab" style="left:${pad}px">${TLI[cls]||''}${lab}</div>`:''}${inner}</div>`;
  const add=(act,txt)=>`<button class="lane-add" data-act="${act}" style="left:${X(0)}px">+ ${txt}</button>`;
  let h=row('ruler','',ticks);
  h+=row('video','Video',L.map((o,i)=>blk('clip',o.c.id,o.start,o.len,L.length>1?`Clip ${i+1}`:fmt(o.len),film(o))).join('')+L.slice(1).map(o=>{const tr=transDe(o.c.id);return`<button class="tr-dot ${tr.tipo!=='corte'?'on':''} ${S.sel?.k==='trans'&&S.sel.id===o.c.id?'sel':''}" data-kind="trans" data-id="${o.c.id}" style="left:${X(o.start)}px" title="Transición: ${TRANS.find(x=>x[0]===tr.tipo)[1]}" aria-label="Transición"></button>`}).join(''));
  h+=row('subs','Subtítulos',E.subs.length?E.subs.map(s=>blk('sub',s.id,s.a,s.b-s.a,s.t)).join(''):add('addSub','Agregar subtítulo'));
  h+=row('elems','Textos',E.elems.length?E.elems.map(s=>blk('elem',s.id,s.a,s.b-s.a,s.tipo==='imagen'?(s.nombre||'Imagen'):s.t)).join(''):add('addTexto','Agregar texto'));
  h+=row('sfx','Efectos',E.audio.sfx.length?E.audio.sfx.map(s=>blk('sfx',s.id,s.a,s.dur||1,s.nombre,'',false)).join(''):add('abrirEfectos','Agregar efecto de sonido'));
  const m=E.audio.musica;h+=row('mus','Música',m?blk('mus','mus',m.ini||0,Math.max(0.5,tot-(m.ini||0)),'♪ '+m.nombre,'',false):add('abrirMusica','Agregar música'));
  tlInner.innerHTML=h;scrollToT(true);
}
function scrollToT(force){if(!S.E)return;const x=S.T*S.zoom;if(force||Math.abs(tlScroll.scrollLeft-x)>0.5){S.progX=x;tlScroll.scrollLeft=x}}
function updatePlayhead(){scrollToT()}
tlScroll.addEventListener('scroll',()=>{if(!S.E||(drag&&drag.kind!=='pan'))return;if(S.progX!=null&&Math.abs(tlScroll.scrollLeft-S.progX)<2.5)return;S.progX=null;const T=tlScroll.scrollLeft/S.zoom;if(Math.abs(T-S.T)*S.zoom<1.5)return;if(S.playing)pause();S.T=clamp(T,0,dur());syncVideo(S.T);S.needDraw=true;updateTC()},{passive:true});
new ResizeObserver(()=>{if(S.E&&Math.round(tlScroll.clientWidth/2)!==S.pad)renderTimeline()}).observe(tlScroll);
let drag=null;
const KSEL={clip:'clip',sub:'sub',elem:'elem',sfx:'sfx',mus:'mus'},KTAB={clip:'trans',sub:'subs',elem:'textos',sfx:'audio',mus:'audio'};
tlInner.addEventListener('pointerdown',e=>{if(!S.E||e.button>0)return;if(e.target.closest('.lane-add'))return;
  const touch=e.pointerType!=='mouse';
  const dot=e.target.closest('.tr-dot');if(dot){select('trans',dot.dataset.id,'trans');return}
  const b=e.target.closest('.blk');
  if(b){const kind=b.dataset.kind,id=b.dataset.id,edge=e.target.dataset.edge||'m',ya=S.sel?.id===id;
    if(touch&&!ya){drag={kind:'tap',sk:KSEL[kind],id,tab:KTAB[kind],x0:e.clientX};return}
    if(touch&&kind==='clip'&&edge==='m')return;
    if(!ya)select(KSEL[kind],id,KTAB[kind]);
    const it=kind==='mus'?S.E.audio.musica:selItem();if(!it)return;pushHist(true);if(S.playing)pause();
    drag={kind,edge,it,x0:e.clientX,a0:it.a,b0:it.b,ini0:kind==='mus'?(it.ini||0):it.ini,fin0:it.fin,moved:false};e.preventDefault();return}
  if(touch){drag={kind:'tapVacio',x0:e.clientX};return}
  drag={kind:'pan',x0:e.clientX,sl0:tlScroll.scrollLeft,moved:false};e.preventDefault();
});
addEventListener('pointermove',e=>{if(!drag)return;const z=S.zoom;
  if(drag.kind==='tap'||drag.kind==='tapVacio'){if(Math.abs(e.clientX-drag.x0)>8)drag=null;return}
  if(drag.kind==='pan'){if(Math.abs(e.clientX-drag.x0)>3)drag.moved=true;tlScroll.scrollLeft=drag.sl0-(e.clientX-drag.x0);return}
  let dt=(e.clientX-drag.x0)/z;if(Math.abs(e.clientX-drag.x0)>2)drag.moved=true;if(!drag.moved)return;const it=drag.it,tot=dur(),snap=8/z;
  const sn=v=>Math.abs(v-S.T)<snap?S.T:v;
  if(drag.kind==='clip'){if(drag.edge==='l')it.ini=clamp(drag.ini0+dt,0,it.fin-0.2);else if(drag.edge==='r')it.fin=clamp(drag.fin0+dt,it.ini+0.2,S.srcDur||drag.fin0)}
  else if(drag.kind==='sub'||drag.kind==='elem'){if(drag.edge==='m'){const len=drag.b0-drag.a0;let a=sn(drag.a0+dt);a=clamp(a,0,Math.max(0,tot-len));it.a=a;it.b=a+len}else if(drag.edge==='l')it.a=clamp(sn(drag.a0+dt),0,it.b-0.1);else it.b=clamp(sn(drag.b0+dt),it.a+0.1,tot)}
  else if(drag.kind==='sfx')it.a=clamp(sn(drag.a0+dt),0,tot);
  else if(drag.kind==='mus')it.ini=clamp(drag.ini0+dt,0,Math.max(0,tot-0.5));
  renderTimeline();S.needDraw=true;if(drag.kind==='clip')syncVideo(S.T);updateTC();
});
addEventListener('pointercancel',()=>{if(drag&&(drag.kind==='tap'||drag.kind==='tapVacio'))drag=null});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;
  if(d.kind==='tap'){select(d.sk,d.id,d.tab);return}
  if(d.kind==='tapVacio'){if(S.sel)select(null);return}
  if(d.kind==='pan'){if(!d.moved&&e.target.closest&&e.target.closest('#tlInner')){const r=tlInner.getBoundingClientRect();setT((e.clientX-r.left-S.pad)/S.zoom)}return}
  if(d.moved){scheduleSave();renderInspector()}else sinCambios()});
function setZoom(z){S.zoom=clamp(Math.round(z),15,320);$('#zoom').value=S.zoom;renderTimeline()}
$('#zoomIn').onclick=()=>setZoom(S.zoom*1.4);$('#zoomOut').onclick=()=>setZoom(S.zoom/1.4);
$('#zoom').addEventListener('input',e=>setZoom(+e.target.value));

  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>'};
const TAB_NOMBRE={subs:'Subtítulos',textos:'Textos',filtros:'Filtros',trans:'Editar',audio:'Audio',calidad:'Calidad'};
const esMovil=()=>matchMedia('(max-width:900px)').matches;
function renderToolbar(){const tb=$('#toolbar');const s=S.sel,it=selItem();const b=(act,ic,lab,cls='')=>`<button class="tool ${cls}" data-act="${act}" aria-label="${lab||'Volver'}">${TI[ic]}<span>${lab}</span></button>`;let h;

  else h=b('hVideos','grid','Videos')+b('hTrans','scissors','Editar')+b('hAudio','note','Audio')+b('hTextos','text','Texto')+b('hSubs','captions','Subtítulos')+b('hSonidos','spark','Sonidos')+b('hFiltros','filter','Filtros')+b('hCalidad','hd','Calidad');
  tb.innerHTML=h;renderCtx()}
function renderCtx(){const cb=$('#ctxbar'),s=S.sel,it=selItem();if(!S.E||!s||!(s.k==='sub'||s.k==='elem')||!it){cb.hidden=true;cb.innerHTML='';return}
  const b=(act,ic,lab,cls='')=>`<button class="${cls}" data-act="${act}" aria-label="${lab}">${TI[ic]}<span>${lab}</span></button>`;const img=it.tipo==='imagen';
  cb.innerHTML=(img?b('hPos','move','Tamaño'):b('hTexto','pencil','Editar')+b('hEstilo','palette','Estilo')+b('hAnim','spark','Animación'))+b('duplicar','copy','Duplicar')+b('borrarSel','trash','Eliminar','danger');cb.dataset.id=it.id;posCtx()}
function posCtx(){const cb=$('#ctxbar');if(!cb.innerHTML||!S.sel){cb.hidden=true;return}const h=S.hits.find(x=>x.id===S.sel.id);
  if(!h||S.exporting||(gest&&gest.movido)){cb.hidden=true;return}cb.hidden=false;
  const w=$('#cwrap'),wr=w.getBoundingClientRect(),cr=cv.getBoundingClientRect(),k=cv.width/cr.width,a=(h.rot||0)*Math.PI/180;
  const ex=Math.abs(h.w/2*Math.cos(a))+Math.abs(h.h/2*Math.sin(a)),ey=Math.abs(h.w/2*Math.sin(a))+Math.abs(h.h/2*Math.cos(a));
  const ox=cr.left-wr.left,oy=cr.top-wr.top,bw=cb.offsetWidth,bh=cb.offsetHeight;
  let x=ox+h.cx/k-bw/2,y=oy+(h.cy-ey)/k-bh-14;if(y<4)y=oy+(h.cy+ey)/k+22;
  x=clamp(x,4,Math.max(4,wr.width-bw-4));y=clamp(y,4,Math.max(4,wr.height-bh-4));cb.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`}
function abrirHoja(tab,sec){setTab(tab);if(esMovil()){$('#biblio').classList.remove('open');$('#insp').classList.add('open')}if(sec)setTimeout(()=>document.getElementById(sec)?.scrollIntoView({block:'start',behavior:'smooth'}),60)}
function abrirLib(){if(esMovil())$('#insp').classList.remove('open');$('#biblio').classList.add('open')}

Object.assign(ACT,{
  deselect:()=>select(null),cerrarHoja:()=>cerrarHojas(),
  hVideos:()=>{setLib('videos');abrirLib()},hSonidos:()=>{setLib('sonidos');abrirLib()},
  abrirEfectos:()=>{S.sndCat='Todos';setLib('sonidos');abrirLib()},abrirMusica:()=>{S.sndCat='Música';setLib('sonidos');abrirLib()},
  hTrans:()=>abrirHoja('trans'),hAudio:()=>abrirHoja('audio'),hTextos:()=>abrirHoja('textos'),hSubs:()=>abrirHoja('subs'),hFiltros:()=>abrirHoja('filtros'),hCalidad:()=>abrirHoja('calidad'),
  hTexto:()=>{const it=selItem();if(it)editarTexto2(it)},
  hEstilo:()=>abrirHoja(S.sel.k==='sub'?'subs':'textos','sec-estilo'),hPos:()=>abrirHoja(S.sel.k==='sub'?'subs':'textos','sec-pos'),hAnim:()=>abrirHoja(S.sel.k==='sub'?'subs':'textos','sec-anim'),
  duplicar:()=>{const it=selItem();if(!it)return;const k=S.sel.k;commit(()=>{const c=JSON.parse(JSON.stringify(it));c.id=uid();if(k==='sub'){const len=it.b-it.a;c.a=Math.min(it.b,dur()-0.1);c.b=Math.min(dur(),c.a+len);S.E.subs.push(c)}else{c.y=clamp(it.y+0.06,0,1);S.E.elems.push(c)}S.sel={k,id:c.id}});toast('Duplicado.')}
});
$('#btnCalidad').onclick=()=>{if(S.E)abrirHoja('calidad')};

/* ---------- gestos sobre el video: mover, pellizcar, girar ---------- */
const ptrs=new Map();let gest=null,ultimoToque={id:null,t:0};
function cvPt(e){const r=cv.getBoundingClientRect(),k=cv.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,k}}
function manijaLocal(h){const m=6*(S.dispS||1);return{x:h.w/2+m,y:h.h/2+m}}
function aPantalla(h,l){const a=(h.rot||0)*Math.PI/180;return{x:h.cx+l.x*Math.cos(a)-l.y*Math.sin(a),y:h.cy+l.x*Math.sin(a)+l.y*Math.cos(a)}}
function enCaja(h,p,pad){const a=-(h.rot||0)*Math.PI/180,dx=p.x-h.cx,dy=p.y-h.cy;const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(lx)<=h.w/2+pad&&Math.abs(ly)<=h.h/2+pad}
function tocado(p){const pad=14*p.k;let orden=[...S.hits].reverse();if(S.sel){const h=orden.find(x=>x.id===S.sel.id);if(h)orden=[h,...orden.filter(x=>x!==h)]}return orden.find(h=>enCaja(h,p,pad))||null}
function manijaTocada(p){if(!S.sel)return null;const h=S.hits.find(x=>x.id===S.sel.id);if(!h)return null;const q=aPantalla(h,manijaLocal(h));return Math.hypot(p.x-q.x,p.y-q.y)<=24*p.k?h:null}
function itemDe(h){return h.kind==='sub'?S.E.subs.find(x=>x.id===h.id):S.E.elems.find(x=>x.id===h.id)}
function grupo(it){return it.kind==='sub'&&S.E.subsJuntos===true?S.E.subs:[it]}
function foto(it){return grupo(it).map(o=>({o,x:o.x,y:o.y,rot:o.rot||0,tam:o.est?.tam,esc:o.esc}))}
function aplicarGesto(g,esc,drot,dx,dy){
  const W=cv.width,H=cv.height,pr=g.orig.find(o=>o.o===g.it)||g.orig[0];S.guias={v:false,h:false};
  let nx=pr.x+dx/W,ny=pr.y+dy/H;if(Math.abs(nx-0.5)<8*g.k/W){nx=0.5;S.guias.v=true}if(Math.abs(ny-0.5)<8*g.k/H){ny=0.5;S.guias.h=true}
  let r=pr.rot+drot;const r90=Math.round(r/90)*90;if(drot&&Math.abs(r-r90)<4)r=r90;const dr=r-pr.rot;
  for(const o of g.orig){o.o.x=clamp(o.x+(nx-pr.x),0,1);o.o.y=clamp(o.y+(ny-pr.y),0,1);
    if(o.o!==g.it)continue; /* tamaño y giro: solo el elemento tocado */
    o.o.rot=Math.round((((o.rot+dr)%360)+540)%360-180);
    if(o.o.tipo==='imagen')o.o.esc=clamp(o.esc*esc,0.03,2);else if(o.o.est)o.o.est.tam=clamp(Math.round(o.tam*esc),12,400)}
  g.movido=true;S.needDraw=true;
}
function iniciarPellizco(){const [a,b]=[...ptrs.values()];const it=gest?.it||selItem();if(!it||!(S.sel?.k==='sub'||S.sel?.k==='elem'))return;
  if(!gest||gest.modo==='toque'){pushHist(true)}
  gest={modo:'pellizco',it,k:a.k,orig:foto(it),d0:Math.hypot(b.x-a.x,b.y-a.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},movido:false}}
cv.addEventListener('pointerdown',e=>{if(!S.E)return;e.preventDefault();const p=cvPt(e);ptrs.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId)}catch{}
  if(ptrs.size===2){iniciarPellizco();return}if(ptrs.size>2)return;
  const hm=manijaTocada(p);
  if(hm){if(S.playing)pause();const it=itemDe(hm);pushHist(true);gest={modo:'manija',it,k:p.k,orig:foto(it),c:{x:hm.cx,y:hm.cy},d0:Math.hypot(p.x-hm.cx,p.y-hm.cy)||1,a0:Math.atan2(p.y-hm.cy,p.x-hm.cx),movido:false};return}
  const h=tocado(p);
  if(h){if(S.playing)pause();const k=h.kind==='sub'?'sub':'elem';if(S.sel?.id!==h.id)select(k,h.id,k==='sub'?'subs':'textos');const it=itemDe(h);pushHist(true);gest={modo:'mover',it,id:h.id,k:p.k,orig:foto(it),p0:p,movido:false};return}
  gest={modo:'toque',p0:p,movido:false}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!gest)return;const p=cvPt(e);ptrs.set(e.pointerId,p);
  if(gest.modo==='pellizco'&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(b.x-a.x,b.y-a.y),an=Math.atan2(b.y-a.y,b.x-a.x),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};aplicarGesto(gest,d/gest.d0,(an-gest.a0)*180/Math.PI,m.x-gest.m0.x,m.y-gest.m0.y);return}
  if(gest.modo==='manija'){const d=Math.hypot(p.x-gest.c.x,p.y-gest.c.y),an=Math.atan2(p.y-gest.c.y,p.x-gest.c.x);aplicarGesto(gest,d/gest.d0,(an-gest.a0)*180/Math.PI,0,0);return}
  if(gest.modo==='mover'){const dx=p.x-gest.p0.x,dy=p.y-gest.p0.y;if(!gest.movido&&Math.hypot(dx,dy)<4*p.k)return;aplicarGesto(gest,1,0,dx,dy);return}
  if(gest.modo==='toque'&&Math.hypot(p.x-gest.p0.x,p.y-gest.p0.y)>8*p.k)gest.movido=true});
function finGesto(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size>0){if(gest&&gest.modo==='pellizco')gest.soltando=true;return}
  const g=gest;gest=null;S.guias=null;S.needDraw=true;if(!g||e.type==='pointercancel'&&!g.movido){if(g&&g.modo!=='toque')sinCambios();return}
  if(g.modo==='toque'){if(g.movido)return;if(S.sel&&(S.sel.k==='sub'||S.sel.k==='elem'))select(null);else toggle();return}
  if(g.movido){scheduleSave();renderInspector();if(!lsGet('gestos')){lsSet('gestos','1');toast('Con dos dedos podés agrandar y girar. La manija de la esquina hace lo mismo con un dedo.')}return}
  sinCambios();
  if(g.modo==='mover'){const now=Date.now();if(ultimoToque.id===g.id&&now-ultimoToque.t<380){editarTexto(g.it);ultimoToque={id:null,t:0}}else ultimoToque={id:g.id,t:now}}}
cv.addEventListener('pointerup',finGesto);cv.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',finGesto);
function editarTexto(it){if(it.tipo==='imagen')return;setTimeout(()=>editarTexto2(it),80)}
function editarTexto2(it){abrirHoja(it.kind==='sub'?'subs':'textos');const ta=$(it.kind==='sub'?`textarea[data-bind="subid:${it.id}|t"]`:'textarea[data-bind="elem|t"]');if(ta){ta.scrollIntoView({block:'center',behavior:'smooth'});ta.focus();ta.select()}}
cv.addEventListener('wheel',e=>{const it=selItem();if(!it||!(S.sel.k==='sub'||S.sel.k==='elem'))return;e.preventDefault();const p=cvPt(e);
  if(!S._rueda){pushHist(true)}clearTimeout(S._rueda);S._rueda=setTimeout(()=>{S._rueda=null;scheduleSave();renderInspector()},400);
  const g={it,k:p.k,orig:foto(it)};if(e.shiftKey)aplicarGesto(g,1,e.deltaY>0?3:-3,0,0);else aplicarGesto(g,Math.pow(1.0015,-e.deltaY),0,0,0);S.guias=null},{passive:false});

/* ---------- controles ---------- */
$('#btnPlay').onclick=toggle;$('#btnStart').onclick=()=>setT(0);
$('#tlSplit').onclick=()=>S.E&&splitAt(S.T);$('#tlDel').onclick=borrarSel;
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnExport').onclick=()=>exportar();
$('#btnBiblio').onclick=()=>{$('#biblio').classList.contains('open')?cerrarHojas():abrirLib()};
$('#selVersion').onchange=e=>abrirVersion(+e.target.value);
$('#inTitulo').onchange=e=>{const v=e.target.value.trim();if(v&&S.pid&&S.db)S.db.doc(`proyectos/${S.pid}`).update({titulo:v}).catch(()=>toast('No se pudo renombrar.'))};
$$('#inspTabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.it));
$$('#libTabs button').forEach(b=>b.onclick=()=>setLib(b.dataset.lt));
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||S.exporting||!S.E)return;const mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){e.preventDefault();toggle()}else if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(e.key==='s'||e.key==='S'){if(!mod){e.preventDefault();splitAt(S.T)}}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();borrarSel()}
  else if(e.key==='ArrowLeft'){e.preventDefault();setT(S.T-(e.shiftKey?1:1/30))}else if(e.key==='ArrowRight'){e.preventDefault();setT(S.T+(e.shiftKey?1:1/30))}
  else if(e.key==='Escape')select(null)});

/* ============ exportar ============ */
function elegirMime(){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return null;const c=[['video/mp4;codecs="avc1.640028,mp4a.40.2"','mp4'],['video/mp4;codecs="avc1.4D401F,mp4a.40.2"','mp4'],['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','mp4'],['video/mp4;codecs=avc1,mp4a','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm;codecs=vp8,opus','webm'],['video/webm','webm']];for(const [t,ext] of c)try{if(MediaRecorder.isTypeSupported(t))return{type:t,ext}}catch{}return null}
function exportDims(){const q=S.E.calidad,vw=vid.videoWidth,vh=vid.videoHeight;let W,H;if(q.res==='orig'){W=vw;H=vh}else{const s=+q.res;if(vw<=vh){W=s;H=Math.round(s*vh/vw)}else{H=s;W=Math.round(s*vw/vh)}}return[W-W%2,H-H%2]}
function bps(q){const base={baja:3e6,media:6e6,alta:10e6,maxima:16e6}[q.bitrate]||10e6;let W=1080,H=1920;if(S.E&&vid.videoWidth)[W,H]=exportDims();else if(q.res==='720'){W=720;H=1280}return Math.round(base*clamp(W*H/(1080*1920),0.3,2)*(q.fps>30?1.4:1))}
function seekTo(el,t){return new Promise(r=>{if(Math.abs(el.currentTime-t)<0.01&&el.readyState>=2){r();return}const f=()=>{el.removeEventListener('seeked',f);r()};el.addEventListener('seeked',f);el.currentTime=t;setTimeout(f,4000)})}
const nextFrame=()=>new Promise(r=>{let d=false;const f=()=>{if(!d){d=true;r()}};requestAnimationFrame(f);setTimeout(f,60)});
let ultimoExport=null;
async function exportar(){
  if(!S.E||S.exporting)return;const mime=elegirMime();if(!mime){toast('Este navegador no puede exportar video. Usá Chrome, Edge o Safari.');return}
  if(!vid.videoWidth){toast('El video todavía se está cargando.');return}
  pause();ensureAC();await ac.resume();const E=S.E,tot=dur(),[W,H]=exportDims();
  const ec=document.createElement('canvas');ec.width=W;ec.height=H;const ex=ec.getContext('2d');
  const mb=$('#mbox');$('#modal').hidden=false;
  mb.innerHTML=`<h3>Exportando ${W}×${H} · ${E.calidad.fps} fps</h3><p class="hint" id="expMsg">Preparando fuentes y sonidos…</p><div class="prog"><i id="expBar"></i></div><div class="row-btns"><button class="btn sm ghost" id="expCancel">Cancelar</button></div>`;
  mb.insertBefore(ec,mb.querySelector('.prog'));
  let cancel=false;$('#expCancel').onclick=()=>{cancel=true};
  S.exporting=true;
  try{await Promise.race([document.fonts?.ready,new Promise(r=>setTimeout(r,3000))]);ensureFonts();await new Promise(r=>setTimeout(r,300));txtCache.clear();
    const dest=ac.createMediaStreamDestination();salida.ws.disconnect();salida.ws.connect(dest);
    const vs=ec.captureStream(E.calidad.fps);const stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
    const rec=new MediaRecorder(stream,{mimeType:mime.type,videoBitsPerSecond:bps(E.calidad),audioBitsPerSecond:192000});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    $('#expMsg').textContent='Leyendo el audio del video…';const vbuf=await getBuffer(S.version.video.assetId?{assetId:S.version.video.assetId}:{url:videoURL(S.version)}).catch(()=>null);
    if(!vbuf)toast('No pude leer el audio de este video: el MP4 va a salir con la música y los efectos, sin el sonido original.');
    vidGain=ac.createGain();vidGain.connect(master);vid.muted=true;
    const L=layout();$('#expMsg').textContent='Grabando… dejá esta pestaña visible.';
    for(let i=0;i<L.length;i++){const o=L[i];
      if(rec.state==='recording')rec.pause();await ac.suspend();vid.pause();
      await seekTo(vid,o.c.ini);if(i>0){const tr=transDe(o.c.id);if(tr.tipo==='disolver'||tr.tipo==='deslizar')await seekTo(vPrev,Math.max(0,L[i-1].c.fin-0.04))}
      drawFrame(ex,W,H,o.start,{});applyVol(o.start);
      if(i===0){await scheduleAudio(0);rec.start(1000)}else rec.resume();
      if(vbuf&&o.c.ini<vbuf.duration){const src=ac.createBufferSource();src.buffer=vbuf;src.connect(vidGain);src.start(ac.currentTime,o.c.ini,Math.min(o.len,vbuf.duration-o.c.ini));live.push(src)}
      await ac.resume();await vid.play().catch(()=>{});
      while(true){await nextFrame();if(cancel)throw new Error('cancel');const s=vid.currentTime;const T=o.start+clamp(s-o.c.ini,0,o.len);applyVol(T);drawFrame(ex,W,H,T,{});$('#expBar').style.width=(T/tot*100).toFixed(1)+'%';if(s>=o.c.fin-0.001||vid.ended)break}
      vid.pause();
    }
    drawFrame(ex,W,H,tot-0.001,{});await new Promise(r=>setTimeout(r,120));
    const blob=await new Promise(r=>{rec.onstop=()=>r(new Blob(chunks,{type:mime.ext==='mp4'?'video/mp4':'video/webm'}));rec.stop()});
    await ac.suspend();stopAudio();
    const p=S.proyectos.find(x=>x.id===S.pid);ultimoExport={blob,name:`${slug(p?.titulo||'video')}-v${S.vn}.${mime.ext}`};
    $('#expBar').style.width='100%';
    mb.querySelector('h3').textContent='Video listo';
    $('#expMsg').innerHTML=`<b>${esc(ultimoExport.name)}</b> · ${(blob.size/1048576).toFixed(1)} MB`;
    mb.querySelector('.row-btns').innerHTML=`<button class="btn primary" id="expSave">Descargar ${mime.ext.toUpperCase()}</button><button class="btn ghost" id="expClose">Cerrar</button>`;
    $('#expSave').onclick=guardarExport;$('#expClose').onclick=()=>{$('#modal').hidden=true};
    guardarExport();
  }catch(err){$('#modal').hidden=true;if(err?.message!=='cancel')toast('La exportación falló: '+esc(err?.message||err));else toast('Exportación cancelada.')}
  finally{S.exporting=false;stopAudio();vid.pause();try{vidGain?.disconnect()}catch{}vidGain=null;sonidoVideo();try{salida.ws.disconnect();salida.ws.connect(ac.destination);await ac.resume()}catch{}S.needDraw=true;syncVideo(S.T)}
}
async function guardarExport(){if(!ultimoExport)return;const msg=$('#expMsg');
  if(!S.downloads){msg.innerHTML+='<br>Esta vista no permite descargar archivos. Abrí la página en claude.ai.';return}
  try{await S.downloads.save({filename:ultimoExport.name,data:ultimoExport.blob});toast('Video guardado.')}
  catch(e){if(e?.code==='declined')return;if(e?.code==='rate_limited'){toast('Ya hay una descarga pendiente de confirmar.');return}toast('No se pudo guardar el archivo ('+esc(e?.code||'error')+').')}}

/* ============ arranque ============ */
renderAll();updateTransport();iniciar();
</script>
